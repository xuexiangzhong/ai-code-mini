<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Editor</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1e1e1e; }
    #container { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="container"></div>
  <script src="vs/loader.js"></script>
  <script>
    var editor = null;
    var dirty = false;
    var suppressDirty = false;

    require.config({ paths: { vs: 'vs' } });

    require(['vs/editor/editor.main'], function () {
      editor = monaco.editor.create(document.getElementById('container'), {
        value: '',
        language: 'plaintext',
        theme: 'vs-dark',
        automaticLayout: true,
        fontSize: 13,
        fontFamily: 'JetBrains Mono, SF Mono, Menlo, Consolas, monospace',
        minimap: { enabled: false },
        scrollBeyondLastLine: false,
        mouseWheelScrollSensitivity: 1,
        fastScrollSensitivity: 1,
        wordWrap: 'on',
        tabSize: 2,
        insertSpaces: true
      });
      editor.onDidChangeModelContent(function () {
        if (suppressDirty) {
          return;
        }
        dirty = true;
        if (window.javaBridge && window.javaBridge.onDirty) {
          window.javaBridge.onDirty();
        }
      });
      if (window.javaBridge && window.javaBridge.onEditorReady) {
        window.javaBridge.onEditorReady();
      }
    });

    function setContent(text, language, readOnly) {
      if (!editor) return;
      suppressDirty = true;
      editor.setValue(text || '');
      if (language) {
        monaco.editor.setModelLanguage(editor.getModel(), language);
      }
      editor.updateOptions({ readOnly: !!readOnly });
      dirty = false;
      suppressDirty = false;
    }

    function setReadOnly(readOnly) {
      if (editor) {
        editor.updateOptions({ readOnly: !!readOnly });
      }
    }

    function getContent() {
      return editor ? editor.getValue() : '';
    }

    function getSelection() {
      if (!editor) return '';
      var sel = editor.getSelection();
      return editor.getModel().getValueInRange(sel) || '';
    }

    function setLanguage(language) {
      if (editor && language) {
        monaco.editor.setModelLanguage(editor.getModel(), language);
      }
    }

    function isDirty() {
      return dirty;
    }

    function markClean() {
      dirty = false;
    }

    function insertText(text) {
      if (!editor || text == null) return;
      var selection = editor.getSelection();
      editor.executeEdits('paste', [{
        range: selection,
        text: text,
        forceMoveMarkers: true
      }]);
    }

    function deleteSelection() {
      if (!editor) return;
      var selection = editor.getSelection();
      editor.executeEdits('cut', [{
        range: selection,
        text: '',
        forceMoveMarkers: true
      }]);
    }

    function selectAllText() {
      if (!editor) return;
      editor.setSelection(editor.getModel().getFullModelRange());
    }

    function focusEditor() {
      if (editor) editor.focus();
    }

    function scrollByLines(lines) {
      if (!editor || !lines) return;
      var lineHeight = editor.getOption(monaco.editor.EditorOption.lineHeight);
      editor.setScrollTop(editor.getScrollTop() + lines * lineHeight);
    }

    function isOverlayInputFocused() {
      var active = document.activeElement;
      if (!active || !active.closest) {
        return false;
      }
      return !!(active.closest('.find-widget')
          || active.closest('.monaco-dialog-box')
          || active.closest('.quick-input-widget'));
    }

    function shouldHandleEditorClipboard() {
      return !isOverlayInputFocused();
    }

    function getOverlayInputSelection() {
      var active = document.activeElement;
      if (!isOverlayInputFocused() || !active) {
        return '';
      }
      var start = active.selectionStart;
      var end = active.selectionEnd;
      if (start == null || end == null) {
        return '';
      }
      return (active.value || '').substring(start, end);
    }

    function insertIntoFocusedInput(text) {
      if (text == null || !isOverlayInputFocused()) {
        return false;
      }
      var active = document.activeElement;
      var start = active.selectionStart != null ? active.selectionStart : (active.value || '').length;
      var end = active.selectionEnd != null ? active.selectionEnd : start;
      if (active.setRangeText) {
        active.setRangeText(text, start, end, 'end');
      } else {
        var value = active.value || '';
        active.value = value.substring(0, start) + text + value.substring(end);
        var pos = start + text.length;
        active.selectionStart = pos;
        active.selectionEnd = pos;
      }
      active.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    function deleteOverlayInputSelection() {
      if (!isOverlayInputFocused()) {
        return false;
      }
      var active = document.activeElement;
      var start = active.selectionStart;
      var end = active.selectionEnd;
      if (start == null || end == null || start === end) {
        return false;
      }
      if (active.setRangeText) {
        active.setRangeText('', start, end, 'end');
      } else {
        var value = active.value || '';
        active.value = value.substring(0, start) + value.substring(end);
        active.selectionStart = start;
        active.selectionEnd = start;
      }
      active.dispatchEvent(new Event('input', { bubbles: true }));
      return true;
    }

    function selectAllFocusedInput() {
      if (!isOverlayInputFocused()) {
        return false;
      }
      var active = document.activeElement;
      active.selectionStart = 0;
      active.selectionEnd = (active.value || '').length;
      return true;
    }
  </script>
</body>
</html>
