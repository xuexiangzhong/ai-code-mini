<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Editor</title>
  <style>
    html, body { margin: 0; height: 100%; background: #0f1117; color: #e6edf3; }
    #editor {
      width: 100%; height: 100%; box-sizing: border-box;
      background: #0f1117; color: #e6edf3; border: none;
      padding: 16px; font-family: Menlo, Monaco, Consolas, monospace; font-size: 13px;
      resize: none; outline: none;
    }
  </style>
</head>
<body>
  <textarea id="editor" spellcheck="false" placeholder="Select a file from the tree..."></textarea>
  <script>
    function setContent(text) {
      document.getElementById('editor').value = text || '';
    }
    function getContent() {
      return document.getElementById('editor').value;
    }
  </script>
</body>
</html>
